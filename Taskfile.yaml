# Версия taskfile
version: '3'

vars:
  GOOSE_VERSION: 'v3.14.0'

  BIN_DIR: '{{.ROOT_DIR}}/bin'
  GOOSE: '{{.BIN_DIR}}/goose.exe'
  MIGRATIONS: '{{.ROOT_DIR}}/migrations'

dotenv:
  - .env

tasks:
  install-goose:
# Если все команды из status завершаются успешно (код выхода 0),
# то Task считает задачу уже выполненной и пропускает её.
    status:
      # -x проверяет, что файл существует и является исполняемый
      - test -x {{.GOOSE}}
    desc: "Устанавливаем goose в ./bin"
    cmds:
      - | 
        mkdir -p {{.BIN_DIR}}
        echo "Устанавливаем goose {{.GOOSE}}..."
        GOBIN={{.BIN_DIR}} go install github.com/pressly/goose/v3/cmd/goose@{{.GOOSE_VERSION}}

  migrations-up:
    deps:
      - install-goose
    desc: "Запуск миграции в clickhouse"
    cmds:
      - |
        ./bin/goose.exe -dir ./migrations clickhouse "clickhouse://{{.DB_USER}}:{{.DB_PASSWORD}}@{{.DB_HOST}}:{{.DB_PORT}}" up -v